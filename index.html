<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sweet Café</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #FFF0F5;
    color: #754653;
    margin: 20px;
}

header {
    background-color: #E8A0B5;
    color: white;
    text-align: center;
    padding: 25px;
    border-radius: 15px;
}

h1 {
    font-size: 38px;
}

h2 {
    color: #B65B79;
    text-align: center;
}

table {
    width: 100%;
    background: white;
    border-collapse: collapse;
}

td, th {
    border: 1px solid #E8A0B5;
    padding: 15px;
    text-align: center;
}

th {
    background-color: #F8C8D8;
}

img {
    width: 130px;
    height: 130px;
    object-fit: cover;
    border-radius: 12px;
}

button {
    background-color: #D76C91;
    color: white;
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
}

textarea {
    width: 95%;
    height: 90px;
    padding: 10px;
    border: 1px solid #E8A0B5;
    border-radius: 10px;
}

input {
    margin: 5px;
}

section {
    background: white;
    padding: 20px;
    margin-top: 20px;
    border-radius: 15px;
}
</style>
</head>

<body>

<header>
<h1>Sweet Café ♡</h1>
<p>A little sweetness in every bite!</p>
</header>

<h2>Our Sweet Menu 🍰</h2>

<form id="myForm">

<table>
<tr>
<th>Strawberry Cake</th>
<th>Strawberry Milk</th>
</tr>

<tr>
<td>
<img src="cake.png" alt="Cake"><br>

<input type="checkbox" class="food"
value="Strawberry Cake">

<p>Strawberry Cake</p>
<p>Price: ฿89</p>

Quantity:
<input type="number" class="qty"
min="1" value="1" style="width:60px;">
</td>

<td>
<img src="milk.png" alt="Milk"><br>

<input type="checkbox" class="food"
value="Strawberry Milk">

<p>Strawberry Milk</p>
<p>Price: ฿65</p>

Quantity:
<input type="number" class="qty"
min="1" value="1" style="width:60px;">
</td>
</tr>
</table>

<br>

<button type="button" onclick="saveToMessage()">
Chosen Menu ♡
</button>

<section>
<h2>Chosen Menu Items</h2>
<textarea id="outputMessage" readonly></textarea>
</section>

<section>
<h2>Delivery Address</h2>
<textarea id="address"
placeholder="Enter your delivery address"></textarea>
</section>

<section>
<h2>Order and Address</h2>
<textarea id="orderAndaddress" readonly></textarea>
</section>

</form>

<section>
<h2>Send Order to Email ♡</h2>

<!-- Replace YOUR_FORM_ID with your own Formspree ID -->
<form action="https://formspree.io/f/YOUR_FORM_ID"
method="POST">

<label>Your Order:</label><br><br>

<textarea id="order" name="order" readonly></textarea>

<br><br>

<button type="submit">
Send Order to Email ♡
</button>

</form>
</section>

<script>

function saveToMessage() {

let message = "Sweet Café Order\n\n";
let selected = false;

const foods = document.querySelectorAll(".food");

foods.forEach(function(food) {

if(food.checked) {

selected = true;

const quantity = food.closest("td")
.querySelector(".qty").value;

const price = food.value === "Strawberry Cake" ? 89 : 65;

message += food.value +
" | Price: ฿" + price +
" | Quantity: " + quantity + "\n";

}

});

if(!selected) {
alert("Please select your menu!");
return;
}

const address =
document.getElementById("address").value;

document.getElementById("outputMessage").value =
message;

const combined =
message + "\nDelivery Address:\n" + address;

document.getElementById("orderAndaddress").value =
combined;

document.getElementById("order").value =
combined;

}

</script>

</body>
</html>
