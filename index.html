
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sweet Café</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #FFF3F6;
            margin: 0;
            color: #714653;
        }

        header {
            background-color: #E8A0B5;
            text-align: center;
            padding: 35px;
            color: white;
        }

        h1 {
            font-size: 40px;
        }

        h2 {
            text-align: center;
            color: #B65B79;
        }

        .menu {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .item {
            background-color: white;
            padding: 20px;
            width: 200px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 4px 10px #eacbd4;
        }

        .item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }

        button {
            background-color: #B65B79;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: #91445f;
        }
    </style>

</head>

<body>

    <header>
        <h1>Sweet Café ♡</h1>
        <p>A little sweetness in every bite</p>
    </header>

    <h2>Our Sweet Menu</h2>

    <div class="menu">

        <div class="item">
            <img src="cake.jpg" alt="Strawberry Cake">
            <h3>Strawberry Cake</h3>
            <p>Price: ฿89</p>
            <input type="checkbox"> Select
        </div>

        <div class="item">
            <img src="milk.jpg" alt="Strawberry Milk">
            <h3>Strawberry Milk</h3>
            <p>Price: ฿65</p>
            <input type="checkbox"> Select
        </div>

        <div class="item">
            <img src="macaron.jpg" alt="Macarons">
            <h3>Macarons</h3>
            <p>Price: ฿79</p>
            <input type="checkbox"> Select
        </div>

        <div class="item">
            <img src="brownie.jpg" alt="Brownie">
            <h3>Brownie</h3>
            <p>Price: ฿69</p>
            <input type="checkbox"> Select
        </div>

    </div>

</body>
</html>
